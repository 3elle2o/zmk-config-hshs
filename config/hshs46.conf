# Encoders (Uncomment these two line to add support to your firmware)
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow (Uncomment these two lines to add support to your firmware)
# RGB quickly drains battery power
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Boost the Bluetooth signal only if having connection issues
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable mouse emulation.
CONFIG_ZMK_POINTING=y

# --- CONFIGURAZIONE SPECIFICA PER DONGLE & DISPLAY PROSPECTOR ---
# Abilita la gestione della tastiera split da parte del Dongle
CONFIG_ZMK_SPLIT=y

# Definisci quante periferiche wireless si devono collegare al dongle.
# Imposta 2 se hai sia la metà sinistra che la destra separate.
# Imposta 1 se usi il dongle per ricevere un solo lato.
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_COUNT=2

# Impostazioni dello schermo Prospector
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
