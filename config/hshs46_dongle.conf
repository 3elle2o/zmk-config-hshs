# --- GESTIONE ENERGIA DONGLE ---
# Il dongle è alimentato via USB, non deve mai spegnersi
CONFIG_ZMK_SLEEP=n

# Spegne la UI nativa di ZMK
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n

# Attiva l'interfaccia grafica custom del modulo Prospector (display ST7789 SPI)
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY=y

# Se nel case del Prospector hai montato anche il sensore di luce APDS9960, scommenta questa riga:
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=n

# Forza il Dongle a richiedere lo stato della batteria alle due metà
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --- Desk Buddy: occhi animati (rayreside/zmk-dongle-screen "eyes") ---
# Sostituisce l'etichetta del layer con occhi animati che reagiscono a layer/velocità/inattività
CONFIG_DONGLE_SCREEN_EYES_ACTIVE=y
# Sfondo animato (linee di stress, effetti per layer)
CONFIG_DONGLE_SCREEN_BACKGROUND_ACTIVE=y
# Va spento: con gli occhi attivi l'etichetta del layer disegnerebbe sotto di loro
CONFIG_DONGLE_SCREEN_LAYER_ACTIVE=n
# Con gli occhi attivi, i widget mod e WPM disegnano esattamente dove disegnano
# ora la faccia e il dialogo: vanno spenti (lo dice anche il README del modulo)
CONFIG_DONGLE_SCREEN_MODIFIER_ACTIVE=n
CONFIG_DONGLE_SCREEN_WPM_ACTIVE=n

# Il nRF52840 ha poca RAM: con occhi+sfondo attivi il doppio buffer video di
# LVGL (pensato per un'animazione più fluida) non ci sta più. Lo disattiviamo:
# nessun problema funzionale, solo un filo meno fluido nei redraw.
CONFIG_LV_Z_DOUBLE_VDB=n

# Mappatura layer -> espressione/effetto (facoltativa, personalizzabile).
# Layer di questa tastiera: 1=Usa_Media_cp, 2=NUMBER, 3=SIMBOLI, 4=MOUSE.
# Lasciate a 0 (nessuna) finché non scegli tu le espressioni: vedi la tabella
# nel README del modulo (rayreside/zmk-dongle-screen) per gli id disponibili.
# CONFIG_DONGLE_SCREEN_LAYER_1_EXPRESSION=0
# CONFIG_DONGLE_SCREEN_LAYER_1_EFFECT=0
# CONFIG_DONGLE_SCREEN_LAYER_2_EXPRESSION=9
# CONFIG_DONGLE_SCREEN_LAYER_2_EFFECT=1
# CONFIG_DONGLE_SCREEN_LAYER_3_EXPRESSION=10
# CONFIG_DONGLE_SCREEN_LAYER_3_EFFECT=2
# CONFIG_DONGLE_SCREEN_LAYER_4_EXPRESSION=6
# CONFIG_DONGLE_SCREEN_LAYER_4_EFFECT=3
