# --- GESTIONE ENERGIA DONGLE ---
# Il dongle è alimentato via USB, non deve mai spegnersi
CONFIG_ZMK_SLEEP=n

# Spegne la UI nativa di ZMK
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n

# Attiva l'interfaccia grafica custom del modulo Prospector (display ST7789 SPI)
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY=y

# Se nel case del Prospector hai montato anche il sensore di luce APDS9960, scommenta questa riga:
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=n

# Forza il Dongle a richiedere lo stato della batteria alle due metà
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --- Desk Buddy: occhi animati (rayreside/zmk-dongle-screen "eyes") ---
CONFIG_DONGLE_SCREEN_EYES_ACTIVE=y
# TEMPORANEAMENTE spento: sfondo + occhi insieme sembrano andare in affanno
# di memoria a runtime sul dongle (schermo corrotto). Lo riattiviamo dopo.
CONFIG_DONGLE_SCREEN_BACKGROUND_ACTIVE=n
CONFIG_DONGLE_SCREEN_LAYER_ACTIVE=y
CONFIG_DONGLE_SCREEN_MODIFIER_ACTIVE=n
CONFIG_DONGLE_SCREEN_WPM_ACTIVE=n

# Più margine di memoria "di lavoro" per LVGL (avevamo liberato spazio
# disattivando il doppio buffer: lo usiamo qui invece che lasciarlo vuoto)
CONFIG_LV_Z_MEM_POOL_SIZE=32768

CONFIG_LV_Z_DOUBLE_VDB=n

# Mappatura layer -> espressione/effetto occhi.
# Layer: 1=Usa_Media_cp, 2=NUMBER, 3=SIMBOLI, 4=MOUSE.
CONFIG_DONGLE_SCREEN_LAYER_1_EXPRESSION=9
CONFIG_DONGLE_SCREEN_LAYER_2_EXPRESSION=2
CONFIG_DONGLE_SCREEN_LAYER_3_EXPRESSION=7
CONFIG_DONGLE_SCREEN_LAYER_3_EFFECT=3
CONFIG_DONGLE_SCREEN_LAYER_4_EXPRESSION=8
CONFIG_DONGLE_SCREEN_LAYER_4_EFFECT=1
